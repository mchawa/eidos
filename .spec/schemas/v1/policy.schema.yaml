$schema: "https://json-schema.org/draft/2020-12/schema"
title: PolicySchema
description: "Defines non-negotiable system invariants, compliance rules, or structural guardrails."
type: object
required:
  - type
  - schema
  - id
  - title
  - category
  - rule
  - enforcement
properties:
  type:
    type: string
    const: "product/policy"
  schema:
    type: string
  id:
    type: string
    pattern: "^POL-[A-Z0-9_-]+$"
  title:
    type: string
  category:
    type: string
    enum: [governance, architectural, security, testing, lifecycle]
  rule:
    type: string
  enforcement:
    type: object
    required: [mechanism, severity]
    properties:
      mechanism: { type: string }
      severity:
        type: string
        enum: [blocking, warning]
