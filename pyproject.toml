[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "eidos-ai"
dynamic = ["version"]
description = "Git-Native, Agent-Agnostic Development AI Ecosystem & Lifecycle Orchestrator"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eidos Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "pydantic>=2.7.0",
    "ast-grep-py>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
docs = [
    "zensical>=0.0.69",
]
ast = [
    "ast-grep-py>=0.50.0",
]

[project.scripts]
eidos = "eidos.cli.main:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/eidos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eidos"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "eidos/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "invariant: Architectural invariant verification marker",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLW1510"]
