name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Specs & Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate Eidos living specifications
        run: uv run eidos validate eidos

      - name: Validate Agent Plugin conformance
        run: uv run eidos plugin validate

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: Run test suite with coverage
        run: uv run pytest -v --cov=src/eidos --cov-report=term-missing

  build-site:
    name: Build Documentation & Living Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build documentation site with Zensical
        run: uv run zensical build --strict

      - name: Build Living Architecture Portal into site/portal
        run: uv run eidos build-site --path eidos --out site/portal

      - name: Verify generated static assets
        run: |
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/search.json
          test -f site/portal/index.html
          test -f site/portal/data.json

      - name: Upload Pages artifact
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-pages:
    name: Deploy to GitHub Pages 🌐
    needs: [validate, test, build-site]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
