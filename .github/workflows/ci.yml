name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Specs & Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint code with Ruff
        run: uv run ruff check src/ tests/

      - name: Validate Eidos living specifications
        run: uv run eidos validate eidos

      - name: Validate Agent Plugin conformance
        run: uv run eidos plugin validate

      - name: Verify Spec-to-Code Synchronization & Invariant Traceability
        run: uv run eidos drift --base origin/main

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: Run test suite with coverage
        run: uv run pytest -v --cov=src/eidos --cov-report=term-missing

  build-site:
    name: Build Documentation & Living Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate living architecture changelog
        run: uv run eidos changelog

      - name: Build documentation site with Zensical
        run: uv run zensical build --strict

      - name: Build Living Architecture Portal into site/portal
        run: uv run eidos build-site --path eidos --out site/portal

      - name: Verify generated static assets
        run: |
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/search.json
          test -f site/portal/index.html
          test -f site/portal/data.json

      - name: Upload Pages artifact
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-pages:
    name: Deploy to GitHub Pages 🌐
    needs: [validate, test, build-site]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-package:
    name: Build package distributions 📦
    needs: [validate, test, build-site]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate release changelog & notes
        run: |
          uv run eidos changelog
          python3 -c "
          import re, pathlib
          content = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'(## \[[^\]]+\][^\n]*\n.*?\n)(?=## \[|\Z)', content, re.DOTALL)
          pathlib.Path('RELEASE_NOTES.md').write_text(match.group(1).strip() if match else content)
          "

      - name: Build sdist and wheel
        run: uv build

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  publish-to-pypi:
    name: Publish to PyPI 🚀
    needs: [build-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/eidos-ai
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Attach assets to GitHub Release 🏷️
    needs: [build-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes/

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes/RELEASE_NOTES.md
