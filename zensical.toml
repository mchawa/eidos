[project]
site_name = "Eidos"
site_description = "Git-Native, Agent-Agnostic Development AI Ecosystem & Lifecycle Orchestrator"
site_url = "https://mchawa.github.io/eidos/"
repo_url = "https://github.com/mchawa/eidos"
repo_name = "mchawa/eidos"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ]},
  { "Core Concepts" = [
    { "Living Specifications" = "concepts/living-specs.md" },
    { "Knowledge Graph Index" = "concepts/architectural-index.md" },
    { "Explorations (EXP-*)" = "concepts/explorations.md" },
    { "SpecDeltas (DLT-*)" = "concepts/specdeltas.md" },
    { "Invariant Traceability" = "concepts/invariants.md" },
    { "Multi-Design Systems" = "concepts/design.md" },
    { "Schema Glossary" = "concepts/schema-glossary.md" },
  ]},
  { "User Guides" = [
    { "CLI Reference" = "guides/cli.md" },
    { "AI Agent Integration" = "guides/agent-plugin.md" },
    { "Eidos Portal" = "guides/living-portal.md" },
  ]},
  { "Contributing" = "contributing.md" },
  { "Eidos Portal ↗" = "https://mchawa.github.io/eidos/portal/" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
