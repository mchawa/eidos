$schema: "https://json-schema.org/draft/2020-12/schema"
title: DeltaSchema
description: "Defines declarative semantic mutations applied to the product baseline (feature additions, behavior changes, bug fixes, refactorings, and deprecations)."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - status
  - intent
  - mutations
properties:
  type:
    type: string
    const: "delta/mutation"
    description: "The fixed document type identifier. Must always be 'delta/mutation'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^DLT-[A-Z0-9_-]+$"
    description: "Unique mutation identifier following the DLT-<YEAR>-<NUMBER> convention (e.g. DLT-2026-089)."
  title:
    type: string
    description: "Short, descriptive summary of the proposed product or technical mutation."
  status:
    type: string
    enum:
      - draft
      - proposed
      - planned
      - in_review
      - approved
      - applied
      - rejected
    description: "Lifecycle status: draft, proposed, planned, in_review, approved, applied, or rejected."
    examples:
      - "proposed"
      - "planned"
      - "in_review"
      - "approved"
      - "applied"
      - "rejected"
  intent:
    type: object
    description: "The strategic motivation and nature of the proposed change."
    additionalProperties: false
    required:
      - kind
      - motivation
    properties:
      kind:
        type: string
        enum:
          - feature
          - enabler
          - bug
        description: >
          The strategic nature of the mutation:
            - feature (User-facing or product capability delivery, enhancement, or retirement)
            - enabler (Architectural refactor, technical foundation, performance optimization, contract/schema alignment, or governance)
            - bug (Defect correction; pair with bug_classification)
        examples:
          - "feature"
          - "enabler"
          - "bug"
      motivation:
        type: string
        description: "Why this change is needed and the problem it resolves."
      bug_classification:
        type: string
        enum:
          - spec_violation
          - spec_gap
        description: "Only for bugfixes: 'spec_violation' means code diverged from valid spec; 'spec_gap' means spec lacked coverage for an edge condition."
        examples:
          - "spec_violation"
          - "spec_gap"
      severity:
        type: string
        enum:
          - low
          - medium
          - high
          - critical
        description: "Impact severity rating: low, medium, high, or critical."
        examples:
          - "low"
          - "medium"
          - "high"
          - "critical"
  mutations:
    type: array
    description: "Ordered list of atomic semantic operations to perform against the baseline .spec/ documents."
    items:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            # Product: Domains, Capabilities, Personas, Policies & Invariants
            - add_domain
            - modify_domain
            - remove_domain
            - add_capability
            - extend_capability
            - modify_capability
            - deprecate_capability
            - remove_capability
            - add_persona
            - modify_persona
            - remove_persona
            - add_policy
            - modify_policy
            - patch_policy
            - deprecate_policy
            - remove_policy
            - add_invariant
            - patch_invariant
            - remove_invariant
            # Architecture: System Architecture, Containers, Components & Contracts
            - modify_architecture
            - add_container
            - modify_container
            - remove_container
            - add_component
            - modify_component
            - remove_component
            - add_contract
            - modify_contract
            - remove_contract
            # Design: Design Systems, UI Components, Screens, Clients & Flows
            - add_design_system
            - modify_design_system
            - remove_design_system
            - add_ui_component
            - modify_ui_component
            - remove_ui_component
            - add_screen
            - modify_screen
            - remove_screen
            - add_client
            - modify_client
            - remove_client
            - add_flow
            - modify_flow
            - remove_flow
          description: >
            Semantic operation type indicating the exact mutation being executed against the baseline.
            
            Common conventions include:
              - Domains: add_domain, modify_domain, remove_domain
              - Capabilities: add_capability, extend_capability, modify_capability, deprecate_capability, remove_capability
              - Invariants: add_invariant, patch_invariant, remove_invariant
              - Containers: add_container, modify_container, remove_container
              - Components: add_component, modify_component, remove_component
              - Architecture: modify_architecture
              - Policies: add_policy, modify_policy, patch_policy, deprecate_policy, remove_policy
              - Contracts: add_contract, modify_contract, remove_contract
              - Personas: add_persona, modify_persona, remove_persona
              - Design: add_design_system, modify_design_system, remove_design_system, add_ui_component, modify_ui_component, remove_ui_component, add_screen, modify_screen, remove_screen, add_client, modify_client, remove_client, add_flow, modify_flow, remove_flow
          examples:
            - "add_capability"
            - "extend_capability"
            - "patch_invariant"
            - "add_container"
            - "modify_container"
            - "add_component"
            - "modify_component"
            - "modify_architecture"
            - "modify_screen"
            - "add_ui_component"
            - "modify_design_system"
        title:
          type: string
          description: "Optional human-readable title when scaffolding a new specification via add_* mutations."
        target_domain:
          type: string
          pattern: "^(DOM-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target domain ID or relative path (e.g. DOM-PRODUCT-CORE or eidos/domains/auth/domain.adoc)."
        target_capability:
          type: string
          pattern: "^(CAP-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target capability ID or relative path (e.g. CAP-AUTH-004)."
        target_container:
          type: string
          pattern: "^(CNT-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target C4 Level 2 container ID or relative path (e.g. CNT-CORE)."
        target_component:
          type: string
          pattern: "^(CMP-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target C4 Level 3 component ID or relative path (e.g. CMP-CORE-VALIDATOR)."
        target_architecture:
          type: string
          pattern: "^(ARCH-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target architecture ID or relative path (e.g. ARCH-EIDOS-001 or eidos/architecture/system-architecture.adoc)."
        target_contract:
          type: string
          pattern: "^(CTR-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target contract ID or relative path (e.g. CTR-OPENAPI)."
        target_policy:
          type: string
          pattern: "^(POL-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target policy ID or relative path (e.g. POL-001)."
        target_persona:
          type: string
          pattern: "^(PER-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target persona ID or relative path (e.g. PER-SOFTWARE-ENGINEER)."
        target_invariant_id:
          type: string
          pattern: "^INV-[A-Z0-9_-]+$"
          description: "Target invariant ID being patched or removed (e.g. INV-GUEST-001)."
        target_design_system:
          type: string
          pattern: "^(DS-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target design system ID or relative path (e.g. DS-CORE or eidos/design/systems/core/system.adoc)."
        target_screen:
          type: string
          pattern: "^(SCR-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target screen ID or relative path (e.g. SCR-CHECKOUT or eidos/design/screens/checkout.adoc)."
        target_ui_component:
          type: string
          pattern: "^(UIC-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target UI component ID or relative path (e.g. UIC-BUTTON or eidos/design/systems/core/components/button.adoc)."
        target_client:
          type: string
          pattern: "^(CLT-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target client ID or relative path (e.g. CLT-WEB-PORTAL)."
        target_flow:
          type: string
          pattern: "^(FLOW-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Target flow ID or relative path (e.g. FLOW-CHECKOUT)."
        new_capability_id:
          type: string
          pattern: "^CAP-[A-Z0-9_-]+$"
          description: "New capability ID being created if action is add_capability."
        details:
          type: string
          description: "Additional operational notes, migration directives, or deprecation sunset timeline."
        expect:
          type: object
          additionalProperties: true
          description: "Optional declarative post-condition assertions (frontmatter key-value pairs or substrings) expected on the target specification after applying an add_*, modify_*, extend_*, or patch_* mutation."
  affects:
    type: object
    description: "Explicit entity references affected by this SpecDelta (optional)."
    additionalProperties: false
    properties:
      components:
        type: array
        items:
          type: string
          pattern: "^(CMP-[A-Z0-9_-]+|.*\\.adoc)$"
          x-eidos-ref:
            target_types:
              - tech/component
            prefixes:
              - CMP-
            entity_label: component
      containers:
        type: array
        items:
          type: string
          pattern: "^(CNT-[A-Z0-9_-]+|.*\\.adoc)$"
          x-eidos-ref:
            target_types:
              - tech/container
            prefixes:
              - CNT-
            entity_label: container
      contracts:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - tech/contract
            prefixes:
              - CTR-
      policies:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - product/policy
            prefixes:
              - POL-
      capabilities:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - product/capability
            prefixes:
              - CAP-
      domains:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - product/domain
            prefixes:
              - DOM-
      personas:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - product/persona
            prefixes:
              - PER-
            entity_label: persona
      design_systems:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/system
            prefixes:
              - DS-
            entity_label: design_system
      clients:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/client
            prefixes:
              - CLT-
            entity_label: client
      flows:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/flow
            prefixes:
              - FLOW-
            entity_label: flow
      screens:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/screen
            prefixes:
              - SCR-
            entity_label: screen
      ui_components:
        type: array
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/ui-component
            prefixes:
              - UIC-
            entity_label: ui_component
  blast_radius:
    type: object
    description: "Automated or computed impact analysis across personas, architecture components, and invariants (optional)."
    additionalProperties: false
    properties:
      impacted_personas:
        type: array
        description: "List of persona IDs or document paths affected by this change."
        items:
          type: string
          x-eidos-ref:
            target_types:
              - product/persona
            prefixes:
              - PER-
            entity_label: persona
      impacted_components:
        type: array
        description: "List of C4 Level 3 components (CMP-*) or spec paths that must be modified."
        items:
          type: string
          pattern: "^(CMP-[A-Z0-9_-]+|.*\\.adoc)$"
          x-eidos-ref:
            target_types:
              - tech/component
            prefixes:
              - CMP-
            entity_label: component
      impacted_containers:
        type: array
        description: "List of C4 Level 2 containers (CNT-*) impacted by this change."
        items:
          type: string
          pattern: "^(CNT-[A-Z0-9_-]+|.*\\.adoc)$"
          x-eidos-ref:
            target_types:
              - tech/container
            prefixes:
              - CNT-
            entity_label: container
      impacted_design_systems:
        type: array
        description: "List of design systems impacted by this change (e.g. DS-CORE, DS-ACME)."
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/system
            prefixes:
              - DS-
            entity_label: design_system
      impacted_screens:
        type: array
        description: "List of screen specifications modified or affected."
        items:
          type: string
          x-eidos-ref:
            target_types:
              - design/screen
            prefixes:
              - SCR-
            entity_label: screen
      invariants_to_enforce:
        type: array
        description: "List of invariant or policy IDs that must have green passing tests before this delta can merge."
        items:
          type: string
          pattern: "^(INV|POL)-[A-Z0-9_-]+$"
  tombstone:
    type: object
    description: "Optional tombstone policy and search-token exemptions for deletion/deprecation audits (eidos delta audit)."
    additionalProperties: false
    properties:
      search_tokens:
        type: array
        description: "Additional code symbols, module names, or string tokens to scan for dangling references."
        items:
          type: string
      allowed_reasons:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - path
          properties:
            path:
              type: string
              description: "Relative path or substring matching exempt files."
            pattern:
              type: string
              description: "Optional regex pattern matching exempt lines within the file."
            reason:
              type: string
              description: "Justification for why this reference is exempt from deletion audit failures."
        description: "Explicit path/pattern exemptions for legitimate historical or compatibility references."
  vcs:
    type: object
    description: "Traceability link to human issue tracker and pull request."
    additionalProperties: false
    properties:
      issue:
        type: string
        description: "External issue identifier (e.g. '#42', 'PROJ-123')."
      issue_url:
        type: string
        format: uri
        description: "Direct URL to external issue."
      pull_request:
        type: string
        description: "External pull request / merge request identifier (e.g. '#105')."
      pull_request_url:
        type: string
        format: uri
        description: "Direct URL to pull request."
      branch:
        type: string
        description: "Git branch name."
      base_commit:
        type: string
        description: "Optional base Git commit SHA recorded when the SpecDelta was created."

