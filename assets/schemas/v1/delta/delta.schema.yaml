$schema: "https://json-schema.org/draft/2020-12/schema"
title: DeltaSchema
description: "Defines declarative semantic mutations applied to the product baseline (feature additions, behavior changes, bug fixes, refactorings, and deprecations)."
type: object
required:
  - type
  - schema
  - id
  - title
  - status
  - intent
  - mutations
properties:
  type:
    type: string
    const: "delta/mutation"
    description: "The fixed document type identifier. Must always be 'delta/mutation'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^DLT-[A-Z0-9_-]+$"
    description: "Unique mutation identifier following the DLT-<YEAR>-<NUMBER> convention (e.g. DLT-2026-089)."
  title:
    type: string
    description: "Short, descriptive summary of the proposed product or technical mutation."
  status:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: "Lifecycle status: proposed, in_review, approved, applied, rejected, or custom workflow state."
    examples:
      - "proposed"
      - "in_review"
      - "approved"
      - "applied"
      - "rejected"
  intent:
    type: object
    description: "The strategic motivation and nature of the proposed change."
    required:
      - kind
      - motivation
    properties:
      kind:
        type: string
        pattern: "^[a-z0-9_-]+$"
        description: >
          The functional nature of the mutation. Open to any engineering workflow.
          
          Common conventions include:
            - feature_addition (New user-facing or technical capability)
            - feature_removal (Deprecating or deleting a capability)
            - modification (Changing existing business logic or behavior)
            - bugfix (Correcting an anomaly)
            - refactor (Internal code or spec cleanup without behavioral change)
            - security_patch (Addressing a vulnerability)
            - performance_optimization (Speed, throughput, or memory improvement)
            - chore / documentation (Tooling or doc adjustments)
        examples:
          - "feature_addition"
          - "feature_removal"
          - "modification"
          - "bugfix"
          - "refactor"
      motivation:
        type: string
        description: "Why this change is needed and the problem it resolves."
      bug_classification:
        type: string
        pattern: "^[a-z0-9_-]+$"
        description: "Only for bugfixes: 'spec_violation' means code diverged from valid spec; 'spec_gap' means spec lacked coverage for an edge condition."
      severity:
        type: string
        pattern: "^[a-z0-9_-]+$"
        description: "Impact severity rating (e.g. low, medium, high, critical)."
  mutations:
    type: array
    description: "Ordered list of atomic semantic operations to perform against the baseline .spec/ documents."
    items:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          pattern: "^[a-z0-9_-]+$"
          description: >
            Semantic operation type indicating the exact mutation being executed against the baseline.
            
            Common conventions include:
              - Capabilities: add_capability, extend_capability, deprecate_capability, remove_capability
              - Invariants: add_invariant, patch_invariant, remove_invariant
              - Components: add_component, modify_component, remove_component
              - Policies: add_policy, patch_policy, deprecate_policy
              - Contracts: add_contract, modify_contract, remove_contract
              - Entities: add_entity, add_entity_field, remove_entity_field
              - Design: add_design_system, modify_design_system, add_ui_component, modify_ui_component, add_screen, modify_screen, remove_screen
          examples:
            - "add_capability"
            - "extend_capability"
            - "patch_invariant"
            - "add_component"
            - "modify_component"
            - "modify_screen"
            - "add_ui_component"
            - "modify_design_system"
        target_domain:
          type: string
          description: "Target domain ID or relative path (e.g. DOM-PRODUCT-CORE or eidos/domains/auth/domain.adoc)."
        target_capability:
          type: string
          description: "Target capability ID or relative path (e.g. CAP-AUTH-004)."
        target_component:
          type: string
          description: "Target component ID or relative path (e.g. CMP-EIDOS-ENGINE)."
        target_policy:
          type: string
          description: "Target policy ID or relative path (e.g. POL-001)."
        target_invariant_id:
          type: string
          description: "Target invariant ID being patched or removed (e.g. INV-GUEST-001)."
        target_design_system:
          type: string
          description: "Target design system ID or relative path (e.g. DS-CORE or eidos/design/systems/core/system.adoc)."
        target_screen:
          type: string
          description: "Target screen ID or relative path (e.g. SCR-CHECKOUT or eidos/design/screens/checkout.adoc)."
        target_ui_component:
          type: string
          description: "Target UI component ID or relative path (e.g. UIC-BUTTON or eidos/design/systems/core/components/button.adoc)."
        new_capability_id:
          type: string
          description: "New capability ID being created if action is add_capability."
        details:
          type: string
          description: "Additional operational notes, migration directives, or deprecation sunset timeline."
  blast_radius:
    type: object
    description: "Automated or computed impact analysis across personas, architecture components, and invariants (optional)."
    properties:
      impacted_personas:
        type: array
        description: "List of persona document paths affected by this change."
        items:
          type: string
      impacted_components:
        type: array
        description: "List of code packages, modules, or services that must be modified."
        items:
          type: string
      impacted_design_systems:
        type: array
        description: "List of design systems impacted by this change (e.g. DS-CORE, DS-ACME)."
        items:
          type: string
      impacted_screens:
        type: array
        description: "List of screen specifications modified or affected."
        items:
          type: string
      invariants_to_enforce:
        type: array
        description: "List of invariant IDs that must have green passing tests before this delta can merge."
        items:
          type: string
  vcs:
    type: object
    description: "Traceability link to human issue tracker and pull request."
    properties:
      issue:
        type: string
        description: "External issue identifier (e.g. '#42', 'PROJ-123')."
      issue_url:
        type: string
        format: uri
        description: "Direct URL to external issue."
      pull_request:
        type: string
        description: "External pull request / merge request identifier (e.g. '#105')."
      pull_request_url:
        type: string
        format: uri
        description: "Direct URL to pull request."
      branch:
        type: string
        description: "Git branch name."
