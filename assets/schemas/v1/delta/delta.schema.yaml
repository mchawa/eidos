$schema: "https://json-schema.org/draft/2020-12/schema"
title: DeltaSchema
description: "Defines declarative semantic mutations applied to the product baseline (feature additions, behavior changes, bug fixes, refactorings, and deprecations)."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - status
  - intent
  - mutations
properties:
  type:
    type: string
    const: "delta/mutation"
    description: "The fixed document type identifier. Must always be 'delta/mutation'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^DLT-[A-Z0-9_-]+$"
    description: "Unique mutation identifier following the DLT-<YEAR>-<NUMBER> convention (e.g. DLT-2026-089)."
  title:
    type: string
    description: "Short, descriptive summary of the proposed product or technical mutation."
  status:
    $ref: "#/$defs/delta_status"
  intent:
    type: object
    description: "The strategic motivation and nature of the proposed change."
    additionalProperties: false
    required:
      - kind
      - motivation
    properties:
      kind:
        type: string
        enum:
          - feature
          - enabler
          - bug
        description: >
          The strategic nature of the mutation:
            - feature (User-facing or product capability delivery, enhancement, or retirement)
            - enabler (Architectural refactor, technical foundation, performance optimization, contract/schema alignment, or governance)
            - bug (Defect correction; pair with bug_classification)
        examples:
          - "feature"
          - "enabler"
          - "bug"
      motivation:
        type: string
        description: "Why this change is needed and the problem it resolves."
      bug_classification:
        type: string
        enum:
          - spec_violation
          - spec_gap
        description: "Only for bugfixes: 'spec_violation' means code diverged from valid spec; 'spec_gap' means spec lacked coverage for an edge condition."
        examples:
          - "spec_violation"
          - "spec_gap"
      severity:
        type: string
        enum:
          - low
          - medium
          - high
          - critical
        description: "Impact severity rating: low, medium, high, or critical."
        examples:
          - "low"
          - "medium"
          - "high"
          - "critical"
  mutations:
    type: array
    description: "Ordered list of atomic semantic operations to perform against the baseline .spec/ documents."
    items:
      type: object
      additionalProperties: false
      required:
        - operation
        - target
      properties:
        operation:
          type: string
          enum:
            - add
            - modify
            - remove
            - deprecate
          description: "Canonical composable mutation verb (used with 'target' and optional 'parent')."
        target:
          type: string
          pattern: "^((DOM|CAP|PER|POL|INV|ARCH|CNT|CMP|CTR|DS|UIC|SCR|CLT|FLOW)-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Primary target entity ID (or relative .adoc path) for composable mutations; entity type is resolved from the ID prefix."
          x-eidos-ref:
            target_types:
              - product/domain
              - product/capability
              - product/persona
              - product/policy
              - invariant
              - tech/architecture
              - tech/container
              - tech/component
              - tech/contract
              - design/system
              - design/ui-component
              - design/screen
              - design/client
              - design/flow
            prefixes:
              - DOM-
              - CAP-
              - PER-
              - POL-
              - INV-
              - ARCH-
              - CNT-
              - CMP-
              - CTR-
              - DS-
              - UIC-
              - SCR-
              - CLT-
              - FLOW-
            entity_label: target
        parent:
          type: string
          pattern: "^((DOM|CAP|POL|CNT|CMP|DS|CLT)-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Optional parent/scoping entity ID for composable mutations (e.g. owning container for an inline CMP-* or owning capability/policy/container for an INV-*)."
          x-eidos-ref:
            target_types:
              - product/domain
              - product/capability
              - product/policy
              - tech/container
              - tech/component
              - design/system
              - design/client
            prefixes:
              - DOM-
              - CAP-
              - POL-
              - CNT-
              - CMP-
              - DS-
              - CLT-
            entity_label: parent
        title:
          type: string
          description: "Optional human-readable title when scaffolding a new specification."
        details:
          type: string
          description: "Additional operational notes, migration directives, or deprecation sunset timeline."
        expect:
          type: object
          additionalProperties: false
          description: "Optional declarative post-condition assertions (structured body and/or frontmatter blocks) expected on the target specification after applying an add, modify, remove, or deprecate mutation."
          properties:
            body:
              type: object
              additionalProperties: false
              description: "Declarative post-condition assertions evaluated against the uncommented AsciiDoc specification body."
              properties:
                contains:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: "Required substring or list of substrings that must appear in the specification body."
                not_contains:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: "Forbidden substring or list of substrings that must NOT appear in the specification body."
            frontmatter:
              type: object
              additionalProperties: false
              description: "Typed declarative post-condition assertions evaluated against specification YAML frontmatter fields."
              properties:
                responsibility:
                  type: string
                  description: "Expected component or container responsibility statement (or required substring)."
                source_path:
                  $ref: "#/$defs/code_paths"
                rule:
                  type: string
                  description: "Expected policy or invariant rule statement (or required substring)."
                test_binding:
                  type: string
                  pattern: "^(.+::.+|N/A|TBD)$"
                  description: "Expected invariant test binding (file::func, N/A, or TBD)."
                status:
                  $ref: "#/$defs/lifecycle_status"
                version:
                  type: string
                  pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"
                  description: "Expected SemVer version string."
                category:
                  type: string
                  description: "Expected policy category."
                severity:
                  type: string
                  enum:
                    - "blocking"
                    - "warning"
                    - "advisory"
                  description: "Expected policy enforcement severity."
                custom:
                  type: object
                  additionalProperties: true
                  description: "Optional dictionary of additional frontmatter key-value post-conditions."
  tombstone:
    type: object
    description: "Optional tombstone policy and search-token exemptions for deletion/deprecation audits (eidos delta audit)."
    additionalProperties: false
    properties:
      search_tokens:
        type: array
        description: "Additional code symbols, module names, or string tokens to scan for dangling references."
        items:
          type: string
      allowed_reasons:
        type: array
        description: "Explicit path or file exemptions where references to removed/deprecated entities are permitted."
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - reason
          properties:
            path:
              type: string
              description: "Relative file path or directory prefix where the reference is permitted."
            reason:
              type: string
              description: "Audit justification explaining why the reference is intentionally retained."
  graduated_from:
    type: string
    pattern: "^(EXP-[A-Z0-9_-]+|.*\\.adoc)$"
    description: "Optional ID of the exploration document (EXP-*) that proved the hypothesis behind this delta."
    x-eidos-ref:
      target_types:
        - product/exploration
      prefixes:
        - EXP-
      entity_label: exploration
  vcs:
    type: object
    description: "Git version control binding and verification context."
    additionalProperties: false
    properties:
      branch:
        type: string
        description: "Git branch implementing this delta."
      base_commit:
        type: string
        pattern: "^[0-9a-fA-F]{7,40}$"
        description: "Git commit SHA snapshot at the time this delta was created, anchoring baseline diff checks."
      pr_url:
        type: string
        description: "Pull Request or Merge Request URL."
      applied_at_commit:
        type: string
        description: "Git commit SHA when this delta was merged and applied to the baseline."
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives established by this SpecDelta (POL-001)."
    items:
      $ref: "#/$defs/decision"
