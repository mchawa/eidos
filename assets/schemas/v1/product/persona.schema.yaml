$schema: "https://json-schema.org/draft/2020-12/schema"
title: PersonaSchema
description: "Defines an actor (end user, customer, admin, team member, or autonomous AI agent) interacting with the ecosystem or product."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - role_type
properties:
  type:
    type: string
    const: "product/persona"
    description: "The fixed document type identifier. Must always be 'product/persona'."
  id:
    type: string
    pattern: "^PER-[A-Z0-9_-]+$"
    description: "Unique persona identifier following the PER-<ROLE> convention (e.g. PER-PRODUCT-LEAD, PER-END-USER)."
  title:
    type: string
    description: "Descriptive title of the persona role (e.g. 'Product Lead', 'Workspace Admin', 'Shopper', 'Autonomous Agent')."
  status:
    $ref: "#/$defs/lifecycle_status"
  role_type:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Classification of the actor. Intentionally open to support any product domain
      (e.g. end_user, customer, admin, human_engineer, autonomous_agent).
    examples:
      - "end_user"
      - "admin"
      - "human_engineer"
      - "autonomous_agent"
  decisions:
    type: array
    description: "In-place product and actor decisions recorded on this persona specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
