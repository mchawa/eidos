$schema: "https://json-schema.org/draft/2020-12/schema"
title: CapabilitySchema
description: "Defines a concrete product capability, bridging human Jobs-To-Be-Done (JTBD) with technical invariants and test bindings."
type: object
required:
  - type
  - schema
  - id
  - title
  - domain
  - status
  - business
  - technical
properties:
  type:
    type: string
    const: "product/capability"
    description: "The fixed document type identifier. Must always be 'product/capability'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^CAP-[A-Z0-9_-]+$"
    description: "Unique capability identifier following the CAP-<DOMAIN>-<NUMBER> convention (e.g. CAP-PROD-001)."
  title:
    type: string
    description: "Descriptive human-readable title of this capability."
  domain:
    type: string
    description: "The parent domain ID (DOM-*) that owns this capability."
  status:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: "Lifecycle state: draft, proposed, active, deprecated, or custom state slug."
    examples:
      - "draft"
      - "proposed"
      - "active"
      - "deprecated"
  version:
    type: string
    description: "Semantic version of this capability specification (e.g. 1.0.0)."
  business:
    type: object
    description: "Business lens: personas served, jobs-to-be-done, monetization tiers, and applicable policies."
    required:
      - personas
      - jtbd
    properties:
      personas:
        type: array
        description: "List of persona document paths that benefit from or use this capability."
        items:
          type: string
          description: "Relative path to a persona document (e.g. eidos/personas/product-lead.adoc)."
      jtbd:
        type: string
        description: "Core Job-To-Be-Done statement ('When [situation], I want to [action], so that [outcome]')."
      pricing_tiers:
        type: array
        description: "Product pricing or subscription tiers where this capability is accessible (e.g. free, pro, enterprise)."
        items:
          type: string
          description: "Tier name."
      policies:
        type: array
        description: "List of system policy document paths that govern or constrain this capability."
        items:
          type: string
          description: "Relative path to a policy document (e.g. eidos/policies/POL-001-git-as-single-source-of-truth.adoc)."
  experience:
    type: object
    description: "Design & UI/UX lens: screens, user flows, UI components, and supporting design systems (optional for headless/backend capabilities)."
    additionalProperties: true
    properties:
      clients:
        type: array
        description: "List of client application specification paths delivering this capability."
        items:
          type: string
          description: "Relative path to client specification or client ID (e.g. CLT-WEB-PORTAL)."
      design_systems:
        type: array
        description: "List of design system paths or IDs supporting this capability (e.g. eidos/design/systems/core/system.adoc or DS-CORE)."
        items:
          type: string
          description: "Relative path to design system specification or design system ID."
      screens:
        type: array
        description: "List of screen specification document paths delivering this capability."
        items:
          type: string
          description: "Relative path to screen specification (e.g. eidos/design/screens/checkout.adoc)."
      flows:
        type: array
        description: "List of user flow document paths delivering this capability."
        items:
          type: string
          description: "Relative path to user flow specification (e.g. eidos/design/flows/onboarding.adoc)."
      ui_components:
        type: array
        description: "Key UI component manifests utilized by this capability."
        items:
          type: string
          description: "Relative path to UI component specification or component ID (e.g. UIC-CORE-BUTTON)."
  technical:
    type: object
    description: "Technical lens: implementing components, interface contracts, and non-negotiable test-bound invariants."
    required:
      - components
    properties:
      components:
        type: array
        description: "Source code modules, packages, or services that implement this capability."
        items:
          type: string
          description: "Package or module path (e.g. packages/spec-parser)."
      contracts:
        type: object
        description: "External API endpoints, CLI interfaces, and async event contracts (optional)."
        properties:
          interfaces:
            type: array
            description: "Exposed CLI commands, REST endpoints, or RPC procedures."
            items:
              type: string
              description: "Interface signature (e.g. 'eidos spec validate' or 'POST /api/v1/invites')."
          events_published:
            type: array
            description: "Domain events emitted by this capability."
            items:
              type: string
              description: "Event name (e.g. 'auth.guest.invited')."
          events_consumed:
            type: array
            description: "Domain events listened to by this capability."
            items:
              type: string
              description: "Event name (e.g. 'workspace.deleted')."
      invariants:
        type: array
        description: "Deterministic rules and constraints bound directly to automated tests (optional during draft, mandatory for active status)."
        items:
          type: object
          required:
            - id
            - rule
            - test_binding
          properties:
            id:
              type: string
              description: "Unique invariant identifier (e.g. INV-SPEC-VALIDATION)."
            rule:
              type: string
              description: "Clear, unambiguous statement of the invariant condition."
            test_binding:
              type: string
              description: "Target test file and test function verifying this invariant (e.g. tests/specs/test_schema_validation.py::test_all_specs_conform_to_schema)."
