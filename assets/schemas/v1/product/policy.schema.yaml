$schema: "https://json-schema.org/draft/2020-12/schema"
title: PolicySchema
description: "Defines non-negotiable system invariants, compliance rules, structural guardrails, and quality gates."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - category
  - invariants
properties:
  type:
    type: string
    const: "product/policy"
    description: "The fixed document type identifier. Must always be 'product/policy'."
  id:
    type: string
    pattern: "^POL-[A-Z0-9_-]+$"
    description: "Unique policy identifier following the POL-<NUMBER>-<NAME> convention (e.g. POL-001-GIT-SOURCE-OF-TRUTH)."
  title:
    type: string
    description: "Short human-readable title of the policy."
  status:
    $ref: "#/$defs/lifecycle_status"
  category:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Policy category. Open and extensible to support any governance or architectural domain
      (e.g. governance, architectural, security, compliance, testing, performance, lifecycle).
    examples:
      - "governance"
      - "architectural"
      - "security"
      - "compliance"
      - "testing"
  severity:
    type: string
    enum:
      - "blocking"
      - "warning"
      - "advisory"
    description: "Enforcement level: 'blocking' (fails CI / blocks PR), 'warning' (alerts engineers), or 'advisory'."
  invariants:
    type: array
    minItems: 1
    description: "Test-bound invariants (INV-*) defining the authoritative rules and programmatic test bindings for this policy."
    items:
      $ref: "#/$defs/invariant"
  decisions:
    type: array
    description: "In-place architectural and governance decisions recorded on this policy specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
