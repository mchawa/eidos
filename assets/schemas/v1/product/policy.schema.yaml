$schema: "https://json-schema.org/draft/2020-12/schema"
title: PolicySchema
description: "Defines non-negotiable system invariants, compliance rules, structural guardrails, and quality gates."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - category
  - rule
  - enforcement
properties:
  type:
    type: string
    const: "product/policy"
    description: "The fixed document type identifier. Must always be 'product/policy'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^POL-[A-Z0-9_-]+$"
    description: "Unique policy identifier following the POL-<NUMBER>-<NAME> convention (e.g. POL-001-GIT-SOURCE-OF-TRUTH)."
  title:
    type: string
    description: "Short human-readable title of the policy."
  status:
    type: string
    enum:
      - draft
      - proposed
      - planned
      - active
      - deprecated
      - retired
    description: "Optional lifecycle state of the policy specification."
  category:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Policy category. Open and extensible to support any governance or architectural domain.
      
      Common conventions include:
        - governance (Process, ground truth, and workflow rules)
        - architectural (Design patterns, dependency constraints, layering)
        - security (Access control, data protection, token rules)
        - compliance (Regulatory, privacy, GDPR, SOC2 standards)
        - testing (Verification standards, test coverage gates)
        - performance (SLAs, resource utilization, latency budgets)
        - lifecycle (Release gates, deprecation timelines)
    examples:
      - "governance"
      - "architectural"
      - "security"
      - "compliance"
      - "testing"
  rule:
    type: string
    description: "The exact, authoritative rule statement that must be adhered to across the entire ecosystem."
  enforcement:
    type: object
    description: "Specification of how this policy is verified and enforced programmatically."
    additionalProperties: false
    required:
      - mechanism
      - severity
    properties:
      mechanism:
        type: string
        description: "The tooling, CI pipeline step, or linter that programmatically evaluates compliance."
      severity:
        type: string
        pattern: "^[a-z0-9_-]+$"
        description: "Enforcement level: 'blocking' (fails CI / blocks PR), 'warning' (alerts engineers), 'advisory', or 'info'."
        examples:
          - "blocking"
          - "warning"
          - "advisory"
          - "info"
