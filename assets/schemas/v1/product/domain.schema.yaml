$schema: "https://json-schema.org/draft/2020-12/schema"
title: DomainSchema
description: "Defines a bounded context (Domain-Driven Design), its architectural boundaries, responsibilities, and components."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - name
  - classification
  - boundaries
properties:
  type:
    type: string
    const: "product/domain"
    description: "The fixed document type identifier. Must always be 'product/domain'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^DOM-[A-Z0-9_-]+$"
    description: "Unique domain identifier following the DOM-<NAME> convention (e.g. DOM-PRODUCT-CORE)."
  name:
    type: string
    description: "Human-readable name of the domain or bounded context."
  status:
    type: string
    enum:
      - draft
      - proposed
      - planned
      - active
      - deprecated
      - retired
    description: "Optional lifecycle state of the domain specification."
  classification:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Domain classification. Intentionally open to support any DDD taxonomy.
      
      Common conventions include:
        - core (Differentiating business logic giving competitive advantage)
        - supporting (Custom internal helper domain tailored to the core)
        - generic (Standard off-the-shelf capability like auth or billing)
        - platform (Cross-cutting infrastructure or developer platform)
        - shared_kernel (Subdomain shared across multiple bounded contexts)
        - integration (Adapter or gateway domain connecting external legacy systems)
    examples:
      - "core"
      - "supporting"
      - "generic"
      - "platform"
  boundaries:
    type: object
    description: "Functional boundaries defining what this domain owns."
    additionalProperties: false
    required:
      - responsibilities
    properties:
      responsibilities:
        type: array
        description: "Explicit list of business and technical capabilities owned exclusively by this domain."
        items:
          type: string
          description: "A specific area of responsibility."
      out_of_scope:
        type: array
        description: "Explicit list of concerns that this domain does NOT handle and delegates elsewhere (optional)."
        items:
          type: string
          description: "A specific excluded responsibility."
  technical_mapping:
    type: object
    description: "Mapping of this business domain to concrete software packages, repositories, or services (optional)."
    additionalProperties: false
    properties:
      components:
        type: array
        description: "Source code directories, modules, or services that realize this domain."
        items:
          type: string
          description: "Relative path, module name, or container/component ID (e.g. packages/spec-parser or CNT-CORE)."
          x-eidos-ref:
            target_types:
              - tech/container
              - tech/component
            prefixes:
              - CNT-
              - CMP-
            allow_non_id_string: true
      dependencies:
        type: array
        description: "Other domain IDs that this domain depends on or communicates with."
        items:
          type: string
          pattern: "^(DOM-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Referenced domain ID (e.g. DOM-VCS-SYNC)."
          x-eidos-ref:
            target_types:
              - product/domain
            prefixes:
              - DOM-
            entity_label: domain
