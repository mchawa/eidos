$schema: "https://json-schema.org/draft/2020-12/schema"
title: DomainSchema
description: "Defines a bounded context (Domain-Driven Design), its strategic classification, and functional boundaries."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - classification
  - boundaries
properties:
  type:
    type: string
    const: "product/domain"
    description: "The fixed document type identifier. Must always be 'product/domain'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^DOM-[A-Z0-9_-]+$"
    description: "Unique domain identifier following the DOM-<NAME> convention (e.g. DOM-PRODUCT-CORE)."
  title:
    type: string
    description: "Human-readable title of the domain or bounded context."
  status:
    $ref: "#/$defs/lifecycle_status"
  classification:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Domain classification. Intentionally open to support any DDD taxonomy
      (e.g. core, supporting, generic, platform, shared_kernel, integration).
    examples:
      - "core"
      - "supporting"
      - "generic"
      - "platform"
  boundaries:
    type: object
    description: "Functional boundaries defining what this domain owns."
    additionalProperties: false
    required:
      - responsibilities
    properties:
      responsibilities:
        type: array
        description: "Explicit list of business and technical capabilities owned exclusively by this domain."
        items:
          type: string
          description: "A specific area of responsibility."
      out_of_scope:
        type: array
        description: "Explicit list of concerns that this domain does NOT handle and delegates elsewhere (optional)."
        items:
          type: string
          description: "A specific excluded responsibility."
  ubiquitous_language:
    oneOf:
      - type: object
        additionalProperties:
          type: string
      - type: array
        items:
          type: object
          additionalProperties: true
    description: "Canonical Domain-Driven Design glossary terms and definitions scoped to this bounded context (optional)."
  owners:
    type: array
    description: "Teams, roles, or individuals accountable for this bounded context (optional)."
    items:
      type: string
  decisions:
    type: array
    description: "In-place domain and architectural decisions recorded on this domain specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
