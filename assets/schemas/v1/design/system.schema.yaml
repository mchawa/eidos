$schema: "https://json-schema.org/draft/2020-12/schema"
title: DesignSystemSchema
description: "Defines a visual design system, brand identity, W3C tokens manifest, theme capabilities, and inheritance hierarchy for multi-brand/multi-client products."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - status
  - tokens
properties:
  type:
    type: string
    const: "design/system"
    description: "The fixed document type identifier. Must always be 'design/system'."
  id:
    type: string
    pattern: "^DS-[A-Z0-9_-]+$"
    description: "Unique design system identifier following the DS-<NAME> convention (e.g. DS-CORE, DS-ACME)."
  title:
    type: string
    description: "Display title of the design system (e.g. 'Core Product Design System', 'Acme Enterprise Theme')."
  status:
    $ref: "#/$defs/lifecycle_status"
  brand_name:
    type: string
    description: "Human-readable client or brand name (e.g. 'Acme Corporation')."
  extends:
    $ref: "#/$defs/design_system_ref"
  override_mode:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: "Optional override strategy when extending a base design system: 'token_only', 'token_and_component', or 'standalone'."
    examples:
      - "token_only"
      - "token_and_component"
      - "standalone"
  tokens:
    type: object
    description: "W3C Design Tokens Community Group (DTCG) standard tokens manifest and configuration."
    additionalProperties: false
    required:
      - spec_format
      - manifest
    properties:
      spec_format:
        type: string
        description: "Format identifier for design tokens. Recommended standard: 'w3c_design_tokens'."
        examples:
          - "w3c_design_tokens"
      manifest:
        type: string
        description: "Relative path to the W3C tokens JSON file (e.g. 'tokens.json' or 'tokens/brand-overrides.json')."
  theme_capabilities:
    type: object
    description: "Supported color modes, visual density modes, and accessibility presets defined by this design system."
    additionalProperties: false
    properties:
      color_modes:
        type: array
        description: "Supported color schemes (e.g. light, dark, high_contrast)."
        items:
          type: string
      density_modes:
        type: array
        description: "Supported UI density presets (e.g. comfortable, compact)."
        items:
          type: string
  external_references:
    $ref: "#/$defs/external_design_references"
  decisions:
    type: array
    description: "In-place design system decisions recorded on this specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
