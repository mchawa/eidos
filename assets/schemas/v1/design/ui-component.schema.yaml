$schema: "https://json-schema.org/draft/2020-12/schema"
title: UIComponentSchema
description: "Defines a reusable UI component contract, variants, states, accessibility invariants (WCAG, ARIA, keyboard), test bindings, and design system ownership."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - design_system
  - status
properties:
  type:
    type: string
    const: "design/ui-component"
    description: "The fixed document type identifier. Must always be 'design/ui-component'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^UIC-[A-Z0-9_-]+$"
    description: "Unique UI component identifier following the UIC-<NAME> convention (e.g. UIC-CORE-BUTTON, UIC-ACME-HEADER)."
  title:
    type: string
    description: "Display title of the component (e.g. 'Primary Button', 'Enterprise Header')."
  design_system:
    $ref: "#/$defs/design_system_ref"
  implements:
    $ref: "#/$defs/ui_component_ref"
  status:
    $ref: "#/$defs/lifecycle_status"
  category:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: "Component hierarchy or role: atoms, molecules, organisms, layouts, navigation, data_display, feedback, inputs."
  variants:
    type: array
    description: "Supported visual or behavioral variants (e.g. primary, secondary, destructive, ghost, outline)."
    items:
      $ref: "#/$defs/named_descriptor"
  states:
    type: array
    description: "Supported interactive states: default, hover, active, focus, disabled, loading, skeleton, error."
    items:
      $ref: "#/$defs/state_entry"
  accessibility:
    type: object
    description: "Non-negotiable accessibility (a11y) invariants and WCAG compliance contracts."
    additionalProperties: false
    properties:
      wcag_level:
        type: string
        description: "Target WCAG standard: 'AA', 'AAA', or 'A'."
        examples:
          - "AA"
          - "AAA"
      aria_role:
        type: string
        description: "Standard WAI-ARIA role (e.g. 'button', 'dialog', 'navigation', 'alert')."
      keyboard_nav:
        type: string
        description: "Required keyboard interaction behavior (e.g. 'Enter/Space activates, Tab traverses, Escape closes')."
  test_bindings:
    type: object
    description: "Automated verification test bindings: Storybook stories, visual regression tests, and unit specs."
    additionalProperties: false
    properties:
      storybook:
        type: string
        description: "Relative path to Storybook story file (e.g. 'packages/ui/src/Button.stories.tsx')."
      visual_regression:
        type: string
        description: "Relative path to Playwright or visual snapshot test file."
      unit_test:
        type: string
        description: "Relative path to component test file."
  external_references:
    $ref: "#/$defs/external_design_references"
  decisions:
    type: array
    description: "In-place UI component decisions recorded on this specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
