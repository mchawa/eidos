$schema: "https://json-schema.org/draft/2020-12/schema"
title: ScreenSchema
description: "Defines a user-facing product screen/view, route, layout slots, and state machine (loading, empty, active, error)."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - route
  - status
properties:
  type:
    type: string
    const: "design/screen"
    description: "The fixed document type identifier. Must always be 'design/screen'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^SCR-[A-Z0-9_-]+$"
    description: "Unique screen identifier following the SCR-<NAME> convention (e.g. SCR-CHECKOUT, SCR-DASHBOARD)."
  title:
    type: string
    description: "Display title of the screen or view."
  route:
    type: string
    description: "URL path, view surface, or deep link identifier (e.g. '/checkout', '/settings/billing', 'App > CheckoutModal')."
  status:
    $ref: "#/$defs/lifecycle_status"
  slots:
    type: object
    description: "Named layout slots and abstract UI component assignments composing this screen view."
    additionalProperties:
      anyOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
  states:
    type: array
    description: "Explicit screen state matrix: loading, empty, active/success, error, partial."
    items:
      $ref: "#/$defs/state_entry"
  external_references:
    $ref: "#/$defs/external_design_references"
  decisions:
    type: array
    description: "In-place screen architecture decisions recorded on this specification (POL-001)."
    items:
      $ref: "#/$defs/decision"
