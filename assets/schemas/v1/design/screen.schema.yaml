$schema: "https://json-schema.org/draft/2020-12/schema"
title: ScreenSchema
description: "Defines a user-facing product screen/view, route, layout slots, state machine (loading, empty, active, error), and bidirectional links to capabilities and design systems."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - route
  - status
properties:
  type:
    type: string
    const: "design/screen"
    description: "The fixed document type identifier. Must always be 'design/screen'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^SCR-[A-Z0-9_-]+$"
    description: "Unique screen identifier following the SCR-<NAME> convention (e.g. SCR-CHECKOUT, SCR-DASHBOARD)."
  title:
    type: string
    description: "Display title of the screen or view."
  route:
    type: string
    description: "URL path, view surface, or deep link identifier (e.g. '/checkout', '/settings/billing', 'App > CheckoutModal')."
  client:
    type: string
    pattern: "^(CLT-[A-Z0-9_-]+|.*\\.adoc)$"
    description: "ID or relative path of the owning client application (e.g. CLT-WEB-PORTAL)."
    x-eidos-ref:
      target_types:
        - design/client
      prefixes:
        - CLT-
      entity_label: entity
  design_system:
    type: string
    pattern: "^(DS-[A-Z0-9_-]+|.*\\.adoc)$"
    description: "Optional primary design system ID or relative path."
    x-eidos-ref:
      target_types:
        - design/system
      prefixes:
        - DS-
      entity_label: entity
  status:
    type: string
    enum:
      - draft
      - proposed
      - planned
      - active
      - deprecated
      - retired
    description: "Lifecycle status: draft, proposed, planned, active, deprecated, or retired."
    examples:
      - "active"
      - "proposed"
      - "planned"
      - "draft"
      - "deprecated"
  capabilities:
    type: array
    description: "List of product capability document paths or IDs delivering value on this screen."
    items:
      type: string
      pattern: "^(CAP-[A-Z0-9_-]+|.*\\.adoc)$"
      description: "Capability ID or relative path to a capability document (e.g. eidos/domains/checkout/capabilities/express-checkout.adoc)."
      x-eidos-ref:
        target_types:
          - product/capability
        prefixes:
          - CAP-
        entity_label: capability
  supported_design_systems:
    type: array
    description: "List of design system document paths or IDs verified to support and style this screen."
    items:
      type: string
      pattern: "^(DS-[A-Z0-9_-]+|.*\\.adoc)$"
      description: "Relative path or ID of a design system (e.g. eidos/design/systems/core/system.adoc or DS-CORE)."
      x-eidos-ref:
        target_types:
          - design/system
        prefixes:
          - DS-
        entity_label: entity
  slots:
    type: object
    description: "Named layout slots and abstract UI component assignments composing this screen view."
    additionalProperties:
      anyOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
  states:
    type: array
    description: "Explicit screen state matrix: loading, empty, active/success, error, partial."
    items:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: "State name (e.g. loading, empty, active, error, payment_failed)."
        description:
          type: string
          description: "Visual and behavioral specification for this state."
  user_flows:
    type: array
    description: "List of user flow document paths or IDs that transition through this screen."
    items:
      type: string
      pattern: "^(FLOW-[A-Z0-9_-]+|.*\\.adoc)$"
      x-eidos-ref:
        target_types:
          - design/flow
        prefixes:
          - FLOW-
        entity_label: flow
  external_references:
    type: object
    description: "Design mockups, Figma frames, or live prototypes."
    additionalProperties: false
    properties:
      figma_frame_url:
        type: string
        description: "URL to Figma screen frame or prototype flow."
