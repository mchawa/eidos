$schema: "https://json-schema.org/draft/2020-12/schema"
title: ContainerSchema
description: "Defines an independently deployable or runnable unit of code execution or data storage following Arc42 Building Block View (Section 5.1) and C4 Model Level 2 (Containers). Contains an embedded C4 Level 3 Component Whitebox View via the components array."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - container_type
  - runtime
  - source_path
properties:
  type:
    type: string
    const: "tech/container"
    description: "The fixed document type identifier. Must always be 'tech/container'."
  id:
    type: string
    pattern: "^CNT-[A-Z0-9_-]+$"
    description: "Unique C4 Container identifier following CNT-<NAME> (e.g. CNT-CORE, CNT-CLI)."
  title:
    type: string
    description: "Human-readable display title of the container/package."
  status:
    $ref: "#/$defs/lifecycle_status"
  container_type:
    type: string
    description: "The C4 Container classification: service, library, cli_app, frontend_spa, background_worker, ml_pipeline, daemon, database, driver, or custom slug."
  runtime:
    type: string
    description: "Execution environment and primary framework (e.g. 'Python 3.12 / Typer / Hatchling', 'TypeScript / React', 'Rust / Tokio')."
  source_path:
    $ref: "#/$defs/code_paths"
  domain:
    $ref: "#/$defs/domain_ref"
  tier:
    type: string
    description: "Architectural tier classification (optional: presentation, service, core, persistence, or custom tier slug)."
  components:
    type: array
    description: "Arc42 Section 5.2 / C4 Level 3: Component Whitebox View. Inline internal modules, services, or building blocks that constitute this container (standalone components declare their parent via 'container' in their own file)."
    items:
      $ref: "#/$defs/inline_component"
      unevaluatedProperties: false
  contracts:
    $ref: "#/$defs/contracts_block"
  invariants:
    type: array
    description: "Test-bound architectural invariants enforced by this C4 Level 2 container."
    items:
      $ref: "#/$defs/invariant"
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on this C4 Level 2 container specification without standalone ADR files (POL-001)."
    items:
      $ref: "#/$defs/decision"
