$schema: "https://json-schema.org/draft/2020-12/schema"
title: ArchitectureSchema
description: "Defines the global technical architecture following Arc42 sections (Context, Solution Strategy, Building Blocks, Deployment, Cross-cutting) and C4 Model Levels 1 & 2."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - status
  - c4_context
properties:
  type:
    type: string
    const: "tech/architecture"
    description: "The fixed document type identifier. Must always be 'tech/architecture'."
  id:
    type: string
    pattern: "^ARCH-[A-Z0-9_-]+$"
    description: "Unique architecture document identifier (e.g. ARCH-EIDOS-001)."
  title:
    $ref: "#/$defs/non_empty_string"
    description: "Human-readable title of the system architecture specification."
  status:
    $ref: "#/$defs/lifecycle_status"
  version:
    $ref: "#/$defs/semver"
  c4_context:
    type: object
    description: "Arc42 Section 3 / C4 Level 1: System Context. Identifies human/agent actors and external systems."
    additionalProperties: false
    required:
      - actors
    properties:
      actors:
        type: array
        description: "List of existing persona document paths or IDs (type: product/persona) representing human or agent actors interacting with the system."
        items:
          $ref: "#/$defs/persona_ref"
      external_systems:
        type: array
        description: "Third-party platforms, external APIs, or upstream/downstream services outside system boundaries (optional)."
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - role
          properties:
            name:
              $ref: "#/$defs/non_empty_string"
              description: "Name of the external system (e.g. 'Git Repository / CI Pipeline', 'Stripe Gateway')."
            role:
              $ref: "#/$defs/non_empty_string"
              description: "How the system interacts with this external entity."
            protocol:
              $ref: "#/$defs/non_empty_string"
              description: "Communication protocol (e.g. 'Git CLI', 'OAuth2', 'Kafka Topic')."
  import_boundaries:
    type: object
    description: "Declarative system-wide C4 import and HTTP dependency boundary constraints with monotonically shrinking brownfield ratchet baselines."
    additionalProperties: false
    properties:
      tier_rules:
        type: object
        description: "Per-source-tier allow/deny rules referencing C4 container tier slugs (e.g. presentation, service, core, persistence, extensibility)."
        propertyNames:
          $ref: "#/$defs/non_empty_string"
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            allow:
              type: array
              items:
                $ref: "#/$defs/non_empty_string"
            deny:
              type: array
              items:
                $ref: "#/$defs/non_empty_string"
      enforce_declared_containers:
        type: boolean
        description: "When true, forbid cross-container code couplings without a declared contracts.consumes -> CTR-* <- contracts.provides contract."
      ratchet_baseline:
        type: array
        description: "Brownfield legacy import/HTTP coupling ceilings (observed_imports > max_imports fails closed; observed_imports < max_imports emits ratchet_shrink_candidates)."
        items:
          type: object
          additionalProperties: false
          required:
            - source
            - target
            - max_imports
          properties:
            source:
              $ref: "#/$defs/boundary_entity_ref"
              description: "Source container (CNT-*) or component (CMP-*) ID or spec path."
            target:
              $ref: "#/$defs/boundary_entity_ref"
              description: "Target container (CNT-*) or component (CMP-*) ID or spec path."
            max_imports:
              type: integer
              minimum: 1
              description: "Maximum permitted cross-boundary AST import / HTTP call sites (minimum: 1)."
            reason:
              $ref: "#/$defs/non_empty_string"
              description: "Architectural rationale for the temporary legacy coupling ceiling."
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on the global architecture specification without standalone ADR files (POL-001)."
    items:
      $ref: "#/$defs/decision"
