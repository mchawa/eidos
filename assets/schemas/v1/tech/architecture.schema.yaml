$schema: "https://json-schema.org/draft/2020-12/schema"
title: ArchitectureSchema
description: "Defines the global technical architecture following Arc42 sections (Context, Solution Strategy, Building Blocks, Deployment, Cross-cutting) and C4 Model Levels 1 & 2."
type: object
required:
  - type
  - schema
  - id
  - title
  - topology_style
  - c4_context
  - c4_containers
  - solution_strategy
  - cross_cutting_concepts
  - deployment_view
properties:
  type:
    type: string
    const: "tech/architecture"
    description: "The fixed document type identifier. Must always be 'tech/architecture'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^ARCH-[A-Z0-9_-]+$"
    description: "Unique architecture document identifier (e.g. ARCH-EIDOS-001)."
  title:
    type: string
    description: "Human-readable title of the system architecture specification."
  topology_style:
    type: string
    description: "The foundational architectural pattern (e.g. monorepo_orchestrator, microservices, modular_monolith, distributed_mesh, embedded_firmware)."
  c4_context:
    type: object
    description: "Arc42 Section 3 / C4 Level 1: System Context. Identifies human/agent actors and external systems."
    required:
      - actors
    properties:
      actors:
        type: array
        description: "List of existing persona document paths (type: product/persona) representing human or agent actors interacting with the system."
        items:
          type: string
          description: "Relative path to a defined persona (e.g. eidos/personas/product-lead.adoc)."
      external_systems:
        type: array
        description: "Third-party platforms, external APIs, or upstream/downstream services outside system boundaries (optional)."
        items:
          type: object
          required:
            - name
            - role
          properties:
            name:
              type: string
              description: "Name of the external system (e.g. 'GitHub / GitLab', 'Stripe Gateway')."
            role:
              type: string
              description: "How the system interacts with this external entity."
            protocol:
              type: string
              description: "Communication protocol (e.g. 'REST Webhooks', 'OAuth2', 'Kafka Topic')."
  c4_containers:
    type: array
    description: "Arc42 Section 5.1 / C4 Level 2: Container Topology. The high-level deployable units, services, monorepo packages, or applications comprising the system."
    items:
      anyOf:
        - type: string
          description: "Component ID (CMP-*) or relative path to a tech/component document (e.g. CMP-EIDOS-ENGINE or eidos/architecture/components/engine.adoc)."
        - type: object
          required:
            - component_ref
          properties:
            component_ref:
              type: string
              description: "Component ID (CMP-*) or relative path to component specification."
            name:
              type: string
              description: "Display name of the container/package (optional)."
            container_type:
              type: string
              description: "Type of container: service, library, cli_app, frontend_spa, background_worker, ml_pipeline, daemon (optional)."
            runtime:
              type: string
              description: "Execution runtime and primary framework (optional)."
            package_path:
              type: string
              description: "Relative source code directory in the repository (optional)."
  solution_strategy:
    type: array
    description: "Arc42 Section 4: Solution Strategy. Fundamental architectural decisions and paradigms shaping the system."
    items:
      type: string
      description: "A foundational architectural strategy (e.g. 'GitOps State Machine: Git is the single source of truth')."
  cross_cutting_concepts:
    type: object
    description: >
      Arc42 Section 8: Cross-cutting Concepts. Open, flexible catalog of system-wide conventions,
      patterns, and mechanisms. Architects declare only the concepts that apply to their specific system.
      
      Common examples include:
        - authentication_and_authz (Identity, scopes, tokens)
        - error_handling (Standard schemas, exit codes, exceptions)
        - telemetry_and_logging (Structured logs, traces, metrics)
        - concurrency_and_threading (Async event loop, worker threads, actors)
        - persistence_and_caching (Data storage, cache invalidation, ORM)
        - security_and_sandboxing (Process isolation, least privilege)
        - data_serialization (Protobuf, JSON, FlatBuffers)
        - power_and_resources (Memory limits, sleep cycles for embedded/IoT)
    additionalProperties:
      anyOf:
        - type: string
        - type: object
    properties:
      authentication_and_authz:
        type: string
        description: "Global authentication and authorization strategy (optional)."
      error_handling:
        type: string
        description: "Universal error schemas, diagnostic formats, and exception rules (optional)."
      telemetry_and_logging:
        type: string
        description: "Structured logging, distributed tracing, and metrics standards (optional)."
      concurrency_and_threading:
        type: string
        description: "Concurrency model and thread-safety rules (optional)."
      persistence_and_caching:
        type: string
        description: "Shared persistence mechanisms and caching strategies (optional)."
      security_and_sandboxing:
        type: string
        description: "Process isolation, memory safety, and security guardrails (optional)."
  deployment_view:
    type: object
    description: "Arc42 Section 7: Deployment View. Target infrastructure, environments, and CI/CD pipelines."
    required:
      - hosting_model
      - ci_cd_engine
    additionalProperties: true
    properties:
      hosting_model:
        type: string
        description: "Target infrastructure topology (e.g. Local Workstation + Cloud CI Runners, Kubernetes Cluster, AWS Serverless)."
      ci_cd_engine:
        type: string
        description: "Automation pipelines for build, test, and release (e.g. GitHub Actions, GitLab CI)."
