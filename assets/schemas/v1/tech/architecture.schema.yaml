$schema: "https://json-schema.org/draft/2020-12/schema"
title: ArchitectureSchema
description: "Defines the global technical architecture following Arc42 sections (Context, Solution Strategy, Building Blocks, Deployment, Cross-cutting) and C4 Model Levels 1 & 2."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - c4_context
properties:
  type:
    type: string
    const: "tech/architecture"
    description: "The fixed document type identifier. Must always be 'tech/architecture'."
  id:
    type: string
    pattern: "^ARCH-[A-Z0-9_-]+$"
    description: "Unique architecture document identifier (e.g. ARCH-EIDOS-001)."
  title:
    type: string
    description: "Human-readable title of the system architecture specification."
  status:
    $ref: "#/$defs/lifecycle_status"
  c4_context:
    type: object
    description: "Arc42 Section 3 / C4 Level 1: System Context. Identifies human/agent actors and external systems."
    additionalProperties: false
    required:
      - actors
    properties:
      actors:
        type: array
        description: "List of existing persona document paths or IDs (type: product/persona) representing human or agent actors interacting with the system."
        items:
          $ref: "#/$defs/persona_ref"
      external_systems:
        type: array
        description: "Third-party platforms, external APIs, or upstream/downstream services outside system boundaries (optional)."
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - role
          properties:
            name:
              type: string
              description: "Name of the external system (e.g. 'Git Repository / CI Pipeline', 'Stripe Gateway')."
            role:
              type: string
              description: "How the system interacts with this external entity."
            protocol:
              type: string
              description: "Communication protocol (e.g. 'Git CLI', 'OAuth2', 'Kafka Topic')."
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on the global architecture specification without standalone ADR files (POL-001)."
    items:
      $ref: "#/$defs/decision"
