$schema: "https://json-schema.org/draft/2020-12/schema"
title: ArchitectureSchema
description: "Defines the global technical architecture following Arc42 sections (Context, Solution Strategy, Building Blocks, Deployment, Cross-cutting) and C4 Model Levels 1 & 2."
type: object
additionalProperties: false
required:
  - type
  - schema
  - id
  - title
  - topology_style
  - c4_context
  - c4_containers
  - solution_strategy
  - cross_cutting_concepts
  - deployment_view
properties:
  type:
    type: string
    const: "tech/architecture"
    description: "The fixed document type identifier. Must always be 'tech/architecture'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^ARCH-[A-Z0-9_-]+$"
    description: "Unique architecture document identifier (e.g. ARCH-EIDOS-001)."
  title:
    type: string
    description: "Human-readable title of the system architecture specification."
  status:
    type: string
    enum:
      - draft
      - proposed
      - planned
      - active
      - deprecated
      - retired
    description: "Optional lifecycle state of the architecture specification."
  topology_style:
    type: string
    description: "The foundational architectural pattern (e.g. monorepo_orchestrator, microservices, modular_monolith, distributed_mesh, embedded_firmware)."
  c4_context:
    type: object
    description: "Arc42 Section 3 / C4 Level 1: System Context. Identifies human/agent actors and external systems."
    additionalProperties: false
    required:
      - actors
    properties:
      actors:
        type: array
        description: "List of existing persona document paths or IDs (type: product/persona) representing human or agent actors interacting with the system."
        items:
          type: string
          pattern: "^(PER-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Persona ID or relative path to a defined persona (e.g. eidos/personas/product-lead.adoc)."
          x-eidos-ref:
            target_types:
              - product/persona
            prefixes:
              - PER-
            entity_label: persona
      external_systems:
        type: array
        description: "Third-party platforms, external APIs, or upstream/downstream services outside system boundaries (optional)."
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - role
          properties:
            name:
              type: string
              description: "Name of the external system (e.g. 'Git Repository / CI Pipeline', 'Stripe Gateway')."
            role:
              type: string
              description: "How the system interacts with this external entity."
            protocol:
              type: string
              description: "Communication protocol (e.g. 'Git CLI', 'OAuth2', 'Kafka Topic')."
  c4_containers:
    type: array
    description: "Arc42 Section 5.1 / C4 Level 2: Container Topology. The high-level deployable units, services, monorepo packages, or applications comprising the system."
    items:
      anyOf:
        - type: string
          pattern: "^(CNT-[A-Z0-9_-]+|.*\\.adoc)$"
          description: "Container ID (CNT-*) or relative path to a tech/container document (e.g. CNT-CORE or eidos/architecture/containers/core.adoc)."
          x-eidos-ref:
            target_types:
              - tech/container
            prefixes:
              - CNT-
            entity_label: container
        - type: object
          additionalProperties: false
          properties:
            container_ref:
              type: string
              pattern: "^(CNT-[A-Z0-9_-]+|.*\\.adoc)$"
              description: "Container ID (CNT-*) or relative path to container specification."
              x-eidos-ref:
                target_types:
                  - tech/container
                prefixes:
                  - CNT-
                entity_label: container
            component_ref:
              type: string
              pattern: "^((CNT|CMP)-[A-Z0-9_-]+|.*\\.adoc)$"
              description: "Legacy alias: Container ID or relative path."
              x-eidos-ref:
                target_types:
                  - tech/container
                  - tech/component
                prefixes:
                  - CNT-
                  - CMP-
                entity_label: container
            name:
              type: string
              description: "Display name of the container/package (optional)."
            container_type:
              type: string
              description: "Type of container: service, library, cli_app, frontend_spa, background_worker, ml_pipeline, daemon, database (optional)."
            runtime:
              type: string
              description: "Execution runtime and primary framework (optional)."
            package_path:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              description: "Relative source code directory, file path, or glob pattern(s) in the repository (optional)."
  solution_strategy:
    type: array
    description: "Arc42 Section 4: Solution Strategy. Fundamental architectural decisions and paradigms shaping the system."
    items:
      type: string
      description: "A foundational architectural strategy (e.g. 'GitOps State Machine: Git is the single source of truth')."
  cross_cutting_concepts:
    type: object
    description: >
      Arc42 Section 8: Cross-cutting Concepts. Open, flexible catalog of system-wide conventions,
      patterns, and mechanisms. Architects declare only the concepts that apply to their specific system.
    additionalProperties:
      anyOf:
        - type: string
        - type: object
    properties:
      authentication_and_authz:
        type: string
        description: "Global authentication and authorization strategy (optional)."
      error_handling:
        type: string
        description: "Universal error schemas, diagnostic formats, and exception rules (optional)."
      telemetry_and_logging:
        type: string
        description: "Structured logging, distributed tracing, and metrics standards (optional)."
      concurrency_and_threading:
        type: string
        description: "Concurrency model and thread-safety rules (optional)."
      persistence_and_caching:
        type: string
        description: "Shared persistence mechanisms and caching strategies (optional)."
      security_and_sandboxing:
        type: string
        description: "Process isolation, memory safety, and security guardrails (optional)."
  deployment_view:
    type: object
    description: "Arc42 Section 7: Deployment View. Target infrastructure, environments, and CI/CD pipelines."
    additionalProperties: false
    required:
      - hosting_model
      - ci_cd_engine
    properties:
      hosting_model:
        type: string
        description: "Target infrastructure topology (e.g. Local Workstation + Cloud CI Runners, Kubernetes Cluster, AWS Serverless)."
      ci_cd_engine:
        type: string
        description: "Automation pipelines for build, test, and release (e.g. GitHub Actions, GitLab CI)."
      distribution_channels:
        type: array
        description: "Package registries, binary distribution channels, or deployment targets (optional)."
        items:
          type: string
      environments:
        type: array
        description: "Deployment environments (optional)."
        items:
          type: string
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on the global architecture specification without standalone ADR files (POL-001)."
    items:
      $ref: "#/$defs/decision"

$defs:
  decision:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - decision
      - rationale
    properties:
      id:
        type: string
        pattern: "^DEC-[A-Z0-9_-]+$"
        description: "Globally unique architectural decision identifier following DEC-<NAME> (e.g. DEC-ARCH-CENTRALIZED-HYBRID-C4)."
      title:
        type: string
        description: "Concise human-readable title summarizing the architectural decision."
      decision:
        type: string
        description: "Normative statement of the chosen design, technology, or boundary."
      rationale:
        type: string
        description: "Architectural reasoning and trade-offs explaining why this decision was made."
      rejected_alternatives:
        type: array
        description: "Alternative options that were evaluated and rejected, preserving negative architectural knowledge."
        items:
          type: object
          additionalProperties: false
          required:
            - option
            - reason_rejected
          properties:
            option:
              type: string
              description: "Name or summary of the rejected alternative option."
            reason_rejected:
              type: string
              description: "Architectural or operational reason why this option was rejected."
      graduated_from:
        type: string
        pattern: "^((EXP|DLT)-[A-Z0-9_-]+|.*\\.adoc)$"
        description: "Optional Exploration (EXP-*) or SpecDelta (DLT-*) ID or relative path from which this decision graduated."
        x-eidos-ref:
          target_types:
            - product/exploration
            - delta/mutation
          prefixes:
            - EXP-
            - DLT-
          entity_label: exploration or delta

