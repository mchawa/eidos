$schema: "https://json-schema.org/draft/2020-12/schema"
title: ContractSchema
description: "Defines an explicit protocol, API, or interface boundary contract (OpenAPI, gRPC Protobuf, GraphQL, AsyncAPI, JSON-RPC, or CLI interfaces)."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - status
  - protocol
  - container
properties:
  type:
    type: string
    const: "tech/contract"
    description: "The fixed document type identifier. Must always be 'tech/contract'."
  id:
    type: string
    pattern: "^CTR-[A-Z0-9_-]+$"
    description: "Unique contract identifier (e.g. CTR-CLI, CTR-AUTH-OPENAPI)."
  title:
    $ref: "#/$defs/non_empty_string"
    description: "Human-readable title of this interface contract."
  status:
    $ref: "#/$defs/lifecycle_status"
  protocol:
    type: string
    enum:
      - openapi
      - rest_http
      - protobuf
      - graphql
      - asyncapi
      - json_schema
      - json_rpc_stdio
      - python_protocol
      - cli_args
      - code_interface
      - wsdl
      - avro
      - sql_ddl
      - trpc
      - websocket
      - mcp
      - other
    description: "Canonical 17-value protocol format: openapi, rest_http, protobuf, graphql, asyncapi, json_schema, json_rpc_stdio, python_protocol, cli_args, code_interface, wsdl, avro, sql_ddl, trpc, websocket, mcp, or other (requiring custom_protocol)."
  custom_protocol:
    $ref: "#/$defs/non_empty_string"
    description: "Free-text custom protocol identifier (e.g. nats_jetstream, mqtt_v5, custom_binary_tcp). Required when protocol is 'other' and forbidden for all standard protocol enum values."
  container:
    $ref: "#/$defs/container_ref"
  specification_file:
    $ref: "#/$defs/non_empty_string"
    description: "Relative path from repository root to the raw interface schema file (e.g. contracts/api.openapi.yaml, contracts/service.wsdl, schemas/event.avsc) or a source file, directory, or glob/brace-glob pattern (e.g. src/Api/Controllers or src/Api/{Controllers,Endpoints}/**/*.cs) for multi-target source-backed protocols (rest_http, cli_args, code_interface, sql_ddl, trpc, websocket, mcp)."
  version:
    $ref: "#/$defs/semver"
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on this contract specification."
    items:
      $ref: "#/$defs/decision"
if:
  properties:
    protocol:
      const: "other"
  required:
    - protocol
then:
  required:
    - custom_protocol
else:
  not:
    required:
      - custom_protocol
