$schema: "https://json-schema.org/draft/2020-12/schema"
title: ComponentSchema
description: "Defines a dedicated in-process C4 Level 3 Component (CMP-*). Stored centrally in 'eidos/architecture/components/<component>.adoc' with source_path linking to implementation code."
type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - status
  - container
properties:
  type:
    type: string
    const: "tech/component"
    description: "The fixed document type identifier. Must always be 'tech/component'."
  id:
    type: string
    pattern: "^CMP-[A-Z0-9_-]+$"
    description: "Unique C4 Level 3 Component identifier following CMP-<NAME> (e.g. CMP-SPEC-PARSER, CMP-AUTH-SERVICE)."
  title:
    type: string
    description: "Human-readable display title of the component."
  container:
    $ref: "#/$defs/container_ref"
  status:
    $ref: "#/$defs/lifecycle_status"
  version:
    $ref: "#/$defs/semver"
  domain:
    $ref: "#/$defs/domain_ref"
  source_path:
    $ref: "#/$defs/code_paths"
  invariants:
    type: array
    description: "Component-specific operational or architectural invariants."
    items:
      $ref: "#/$defs/invariant"
  decisions:
    type: array
    description: "In-place architectural decisions, trade-offs, and rejected alternatives recorded on this component (POL-001)."
    items:
      $ref: "#/$defs/decision"
