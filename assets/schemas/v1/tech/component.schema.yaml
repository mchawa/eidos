$schema: "https://json-schema.org/draft/2020-12/schema"
title: ComponentSchema
description: "Defines a dedicated in-process C4 Level 3 Component (CMP-*). Stored centrally in 'eidos/architecture/components/<component>.adoc' with source_path linking to implementation code. Extends #/$defs/inline_component with standalone document metadata."
type: object
allOf:
  - $ref: "#/$defs/inline_component"
unevaluatedProperties: false
required:
  - type
  - status
  - container
properties:
  type:
    type: string
    const: "tech/component"
    description: "The fixed document type identifier. Must always be 'tech/component'."
  container:
    $ref: "#/$defs/container_ref"
