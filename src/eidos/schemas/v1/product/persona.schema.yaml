$schema: "https://json-schema.org/draft/2020-12/schema"
title: PersonaSchema
description: "Defines an actor (end user, customer, admin, team member, or autonomous AI agent) interacting with the ecosystem or product."
type: object
required:
  - type
  - schema
  - id
  - name
  - role_type
  - goals
  - pain_points
properties:
  type:
    type: string
    const: "product/persona"
    description: "The fixed document type identifier. Must always be 'product/persona'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^PER-[A-Z0-9_-]+$"
    description: "Unique persona identifier following the PER-<ROLE> convention (e.g. PER-PRODUCT-LEAD, PER-END-USER)."
  name:
    type: string
    description: "Descriptive name of the persona role (e.g. 'Product Lead', 'Workspace Admin', 'Shopper', 'Autonomous Agent')."
  role_type:
    type: string
    pattern: "^[a-z0-9_-]+$"
    description: >
      Classification of the actor. Intentionally open to support any product domain.
      
      Common conventions include:
        - Product End-Users: end_user, customer, admin, operator, shopper, subscriber, guest, auditor
        - Internal Builders: product_manager, software_engineer, architect, devops, designer
        - Automated Systems: autonomous_agent, background_daemon, external_service, webhook_bot
    examples:
      - "end_user"
      - "admin"
      - "human_engineer"
      - "autonomous_agent"
  goals:
    type: array
    description: "Key motivations, objectives, and success criteria for this persona."
    items:
      type: string
      description: "A specific outcome or capability this actor strives to achieve."
  pain_points:
    type: array
    description: "Frictions, risks, or frustrations this persona experiences in conventional workflows."
    items:
      type: string
      description: "A specific workflow friction or risk."
  interaction_modes:
    type: array
    description: "Mechanisms through which this persona interacts with the product (e.g. Web UI, Mobile App, REST API, CLI, Git PRs)."
    items:
      type: string
      description: "An interface or workflow channel."
