$schema: "https://json-schema.org/draft/2020-12/schema"
title: ComponentSchema
description: "Defines a deployable unit, package, or service following Arc42 Building Block View (Section 5) and C4 Model Level 3 (Components & Internal Modules). Supports centralized and co-located layouts."
type: object
required:
  - type
  - schema
  - id
  - name
  - container_type
  - runtime
  - package_path
properties:
  type:
    type: string
    const: "tech/component"
    description: "The fixed document type identifier. Must always be 'tech/component'."
  schema:
    type: string
    description: "Path or URI to this schema file, enabling IDE tooltips and automated validation."
  id:
    type: string
    pattern: "^CMP-[A-Z0-9_-]+$"
    description: "Unique component identifier following CMP-<NAME> (e.g. CMP-EIDOS-ENGINE, CMP-AUTH-SERVICE)."
  name:
    type: string
    description: "Human-readable display name of the container/package."
  container_type:
    type: string
    description: "The C4 Container classification: service, library, cli_app, frontend_spa, background_worker, ml_pipeline, daemon, driver, or custom slug."
  runtime:
    type: string
    description: "Execution environment and primary framework (e.g. 'Python 3.12 / Typer / Hatchling', 'TypeScript / React', 'Rust / Tokio')."
  package_path:
    type: string
    description: >
      Relative path from repository root to the package source code (e.g. 'src/eidos' or 'packages/auth').
      Enables dual-layout support: component documents can live centralized under 'eidos/architecture/components/'
      OR co-located inside the package directory (e.g. 'src/eidos/component.adoc').
  domain_binding:
    type: string
    description: "The product domain ID (DOM-*) this technical component primarily realizes (optional)."
  c4_internal_components:
    type: array
    description: "Arc42 Section 5.2 / C4 Level 3: Component Whitebox View (optional). The internal modules, classes, or building blocks that constitute this package."
    items:
      type: object
      required:
        - name
        - responsibility
        - source_path
      properties:
        name:
          type: string
          description: "Internal component/module name (e.g. 'SpecParser', 'SchemaValidator', 'CliEntrypoint')."
        responsibility:
          type: string
          description: "What this internal module does and what domain logic it encapsulates."
        source_path:
          type: string
          description: "Relative file path to the source file implementing this component (e.g. 'src/eidos/core/parser.py')."
  dependencies:
    type: object
    description: "Explicit monorepo dependencies and external platform dependencies (optional)."
    properties:
      internal_components:
        type: array
        description: "List of other component IDs (CMP-*) in this repository that this component directly imports or calls."
        items:
          type: string
      external_services:
        type: array
        description: "External APIs, databases, or brokers consumed (e.g. PostgreSQL, Redis, GitHub API)."
        items:
          type: string
  contracts:
    type: object
    description: "Exposed and consumed interface contracts (optional)."
    properties:
      provides:
        type: array
        description: "Paths to contract files or protocol specifications exposed by this component."
        items:
          type: string
      consumes:
        type: array
        description: "Paths to contract files or external protocols consumed by this component."
        items:
          type: string
  quality_attributes:
    type: object
    description: "Arc42 Section 10: Quality Requirements and Operational Invariants (optional)."
    properties:
      stateless:
        type: boolean
        description: "Whether component instances are completely stateless."
      idempotent:
        type: boolean
        description: "Whether mutations handled by this component are idempotent."
      concurrency_model:
        type: string
        description: "Concurrency paradigm (e.g. async_event_loop, multi_thread, multi_process, actor)."
      max_memory_mb:
        type: integer
        description: "Maximum allowable memory allocation limit in MB."
